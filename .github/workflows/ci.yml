name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install pytest
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg nsis
      - run: python -m pytest -q tests/engine
      - run: node tests/panel_test.js
      - run: node tests/jsx_mock_test.js
      - name: Installer compiles
        run: makensis -V2 -DVERSION=0.0.0 installer/balakar.nsi
