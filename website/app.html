<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balakar - captions in your browser</title>
<style>:root{--ink:#070d1a;--p:#0e1830;--l:#1c2c4b;--t:#e9eefb;--m:#93a5c6;--s:#ffb020}*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--t);font:16px/1.5 system-ui,"Segoe UI","Nirmala UI","Noto Sans",sans-serif}a{color:#4c8dff}
main{max-width:1040px;margin:0 auto;padding:20px;display:grid;grid-template-columns:1fr 360px;gap:24px}h1{font-size:28px;margin:0 0 4px}
.box{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:14px;margin-bottom:14px}label{display:block;color:var(--m);font-size:13px;margin:7px 0}
select,input,button{font:inherit;color:var(--t);background:#0a1426;border:1px solid var(--l);border-radius:8px;padding:7px;width:100%}input[type=color]{padding:2px;height:34px}input[type=range]{padding:0}
button{cursor:pointer;width:auto;margin:4px 4px 0 0}button.go{background:var(--s);color:#1a1200;border-color:var(--s);font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}canvas{width:100%;border-radius:14px;border:1px solid var(--l);background:#000}
#segs{max-height:380px;overflow:auto}#segs input{margin:3px 0}#st{color:var(--s);min-height:24px}@media(max-width:800px){main{grid-template-columns:1fr}}</style></head><body><main>
<div><h1>Balakar in your browser</h1><p style="color:var(--m);margin:0 0 14px">Free. Your video never leaves this device. <a href="./">Back</a></p>
<div class="box"><label>Video or audio file<input type="file" id="f" accept="video/*,audio/*"></label>
<div class="g2"><label>Language<select id="lang"></select></label><label>Task<select id="task"><option value="transcribe">Transcribe</option><option value="translate">Translate to English</option></select></label></div>
<label>Model (downloaded once, then cached)<select id="model"><option value="Xenova/whisper-tiny">Tiny - 40 MB, fastest</option><option value="Xenova/whisper-base" selected>Base - 75 MB</option><option value="Xenova/whisper-small">Small - 250 MB, most accurate</option></select></label>
<button class="go" id="go">Generate captions</button><div id="st"></div></div>
<div class="box"><b>Captions</b> (edit text, then export)<div id="segs"></div>
<button data-x="srt">SRT</button><button data-x="vtt">VTT</button><button data-x="txt">TXT</button></div></div>
<div><div class="box"><canvas id="cv" width="360" height="640"></canvas>
<label>Caption style<select id="sty"></select></label>
<div class="g2"><label>Font<select id="font"><option value="">Style default</option></select></label><label>Animation<select id="an"><option value="">Style default</option><option value="none">None</option><option value="pop">Pop</option><option value="fade">Fade in</option><option value="slide">Slide up</option><option value="type">Typewriter</option></select></label></div>
<label>Upload your own font (.ttf / .otf / .woff2)<input type="file" id="ff" accept=".ttf,.otf,.woff,.woff2"></label>
<div class="g2"><label>Size <input type="range" id="sz" min="50" max="160" value="100"></label><label>Position <input type="range" id="py" min="10" max="95" value="70"></label>
<label>Text colour <input type="color" id="fill" value="#ffffff"></label><label>Highlight colour <input type="color" id="hl" value="#ffe600"></label></div>
<label>Background<select id="bg"><option value="video">Video</option><option value="#00b140">Green screen</option><option value="#0047bb">Blue screen</option><option value="#000000">Black</option></select></label>
<button id="play">Play / pause</button><button class="go" id="rec">Download captioned video</button></div></div></main>
<video id="v" playsinline style="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none"></video>
<script type="module">
import {pipeline} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2";
const $=i=>document.getElementById(i),v=$("v"),cv=$("cv"),x=cv.getContext("2d");let segs=[];
/* Caption styles. Labels are generic on purpose - rename freely. f=font w=weight up=UPPERCASE sw=outline box=box colour hl=highlight cum=fill-up glow word=one word at a time an=animation y=position */
const ST={"Viral Yellow":{f:"Impact",up:1,fill:"#fff",hl:"#ffe600",sw:.2,an:"pop",y:.64},
"Big Word Pop":{f:"Impact",up:1,fill:"#fff",hl:"#ffe600",sw:.22,an:"pop",y:.5,word:1,k:1.6},
"Clean Minimal":{f:"Segoe UI",w:600,fill:"#fff",an:"fade",y:.85,sw:.08},
"Karaoke Fill":{f:"Arial Black",fill:"#fff",hl:"#3ddc84",cum:1,sw:.16,an:"fade",y:.78},
"Bubble":{f:"Arial Black",fill:"#111",hl:"#e0284f",box:"#fff",an:"pop",y:.8},
"Dark Box":{f:"Segoe UI",w:700,fill:"#fff",hl:"#ffb020",box:"#000b",an:"slide",y:.86},
"Neon Glow":{f:"Verdana",fill:"#e6fbff",hl:"#ff2ec4",glow:"#00b7ff",an:"fade",y:.74},
"Typewriter":{f:"Courier New",w:700,fill:"#f5f5f5",hl:"#ffb020",sw:.14,an:"type",y:.84},
"Outline Pop":{f:"Arial Black",up:1,fill:"#ffe600",sw:.26,an:"pop",y:.7},
"Two-Tone":{f:"Arial Black",fill:"#9aa4b2",hl:"#fff",sw:.14,an:"none",y:.75},
"Reels Center":{f:"Impact",up:1,fill:"#fff",hl:"#ff3b30",sw:.2,an:"pop",y:.5,k:1.2},
"Soft Lower Third":{f:"Trebuchet MS",w:700,fill:"#fff",an:"slide",y:.9,glow:"#000"}};
Object.keys(ST).forEach(k=>$("sty").add(new Option(k,k)));
["Impact","Arial Black","Segoe UI","Trebuchet MS","Verdana","Georgia","Courier New","Nirmala UI","Noto Nastaliq Urdu","Noto Sans Devanagari"].forEach(f=>$("font").add(new Option(f,f)));
["fill","hl","py"].forEach(i=>$(i).oninput=()=>$(i).dataset.t=1);
$("sty").onchange=()=>{["fill","hl","py"].forEach(i=>delete $(i).dataset.t);const s=ST[$("sty").value];$("fill").value=s.fill;$("hl").value=s.hl||s.fill;$("py").value=s.y*100;$("sz").value=100};$("sty").onchange();
$("ff").onchange=async e=>{const f=e.target.files[0];if(!f)return;const n="Custom "+f.name.replace(/\.\w+$/,"");const ff=new FontFace(n,await f.arrayBuffer());await ff.load();document.fonts.add(ff);$("font").add(new Option(n,n));$("font").value=n};
[["auto","Auto-detect"],["hi","Hindi"],["en","English"],["ne","Nepali"],["ur","Urdu"],["ta","Tamil"],["ml","Malayalam"],["gu","Gujarati"],["bn","Bengali"],["pa","Punjabi"],["te","Telugu"],["sd","Sindhi"],["mr","Marathi"],["kn","Kannada"],["ps","Pashto"],["ms","Malay"],["as","Assamese"],["fa","Persian"],["ar","Arabic"]].forEach(([c,n])=>$("lang").add(new Option(n,c)));
const st=m=>$("st").textContent=m,spread=(t,s,e)=>{const a=t.split(/\s+/).filter(Boolean),n=a.reduce((p,w)=>p+w.length,0);let c=s;return a.map(w=>{const d=(e-s)*w.length/n;const o={t:w,s:c,e:c+d};c+=d;return o})};
function group(ws){const o=[];let c=[];for(const w of ws){if(c.length&&(c.length>=6||w.s-c.at(-1).e>.6||c.map(k=>k.t).join(" ").length+w.t.length>32)){o.push(c);c=[]}c.push(w);if(/[.!?؟۔।]$/.test(w.t)&&c.length>1){o.push(c);c=[]}}if(c.length)o.push(c);return o.map(w=>({s:w[0].s,e:w.at(-1).e,w,text:w.map(k=>k.t).join(" ")}))}
function list(){$("segs").innerHTML="";segs.forEach(g=>{const i=document.createElement("input");i.value=g.text;i.dir="auto";i.onchange=()=>{g.text=i.value;g.w=spread(g.text,g.s,g.e)};$("segs").append(i)})}
$("f").onchange=e=>{const f=e.target.files[0];if(!f)return;v.src=URL.createObjectURL(f);
v.onloadedmetadata=()=>{if(v.videoWidth){const k=Math.min(1,720/v.videoWidth,1280/v.videoHeight);cv.width=Math.round(v.videoWidth*k);cv.height=Math.round(v.videoHeight*k)}};
v.onloadeddata=()=>{v.currentTime=.05;if(!v.videoWidth&&f.type.startsWith("video"))st("This browser can't show this video's picture (common with iPhone .mov / HEVC). Captions still work. For a preview, convert to H.264 .mp4 or open in Edge/Safari.")}};
$("go").onclick=async()=>{const f=$("f").files[0];if(!f)return st("Choose a file first.");try{$("go").disabled=true;
const asr=await pipeline("automatic-speech-recognition",$("model").value,{progress_callback:p=>{if(p.status==="progress")st("Downloading model "+Math.round(p.progress)+"%")}});
st("Reading audio...");const a=(await new AudioContext({sampleRate:16000}).decodeAudioData(await f.arrayBuffer())).getChannelData(0);
const o={return_timestamps:"word",chunk_length_s:30,stride_length_s:5,task:$("task").value};if($("lang").value!=="auto")o.language=$("lang").value;
st("Transcribing... (can take a few minutes)");const r=await asr(a,o);
segs=group(r.chunks.map(c=>({t:c.text.trim(),s:c.timestamp[0],e:c.timestamp[1]??c.timestamp[0]+.3})).filter(w=>w.t));list();st(segs.length+" captions ready. Press Play.")}catch(e){st("Error: "+e.message)}$("go").disabled=false};
const cfg=()=>{const b={w:800,fill:"#fff",...ST[$("sty").value]};if($("font").value)b.f=$("font").value;b.sz=$("sz").value/100*(b.k||1);b.y=$("py").value/100;if($("fill").dataset.t)b.fill=$("fill").value;if($("hl").dataset.t)b.hl=$("hl").value;if($("an").value)b.an=$("an").value;return b};
function cap(g,t,W,H){const c=cfg(),l=t-g.s,rtl=/[\u0590-\u08FF]/.test(g.text),act=g.w.findIndex(k=>t>=k.s&&t<k.e);
let ws=g.w.map((k,i)=>({t:c.up&&!rtl?k.t.toUpperCase():k.t,i}));
if(c.word)ws=[ws[act>=0?act:Math.max(0,g.w.filter(k=>t>=k.s).length-1)]];
if(c.an==="type"){const n=Math.ceil(ws.length*Math.min(1,l/Math.max((g.e-g.s)*.6,.2)));ws=ws.slice(0,Math.max(n,1))}
let fs=W*.085*c.sz;const F=()=>x.font=`${c.w} ${fs}px "${c.f}","Noto Sans","Nirmala UI",sans-serif`;F();
const sp=fs*.28,od=rtl?[...ws].reverse():ws,wd=()=>od.reduce((p,k)=>p+x.measureText(k.t).width+sp,0)-sp;while(wd()>W*.9&&fs>10){fs-=2;F()}
let al=1,sc=1,dy=0;if(c.an==="fade")al=Math.min(1,l/.12);if(c.an==="pop")sc=l<.1?.6+l/.1*.52:l<.18?1.12-(l-.1)/.08*.12:1;
if(c.an==="slide"){const p=Math.min(1,l/.18);dy=40*(1-p*p*(3-2*p));al=Math.min(1,l/.1)}
const tot=wd(),y=H*c.y+dy;x.save();x.globalAlpha=al;x.translate(W/2,y);x.scale(sc,sc);x.translate(-W/2,-y);x.textBaseline="middle";let px=(W-tot)/2;
if(c.box){x.fillStyle=c.box;x.beginPath();x.roundRect(px-fs*.5,y-fs*.8,tot+fs,fs*1.6,fs*.4);x.fill()}
od.forEach(k=>{const m=x.measureText(k.t).width,on=c.hl&&act>=0&&(k.i===act||(c.cum&&k.i<act));
if(c.glow){x.shadowColor=on&&c.glow!=="#000"?c.hl:c.glow;x.shadowBlur=fs*.35}
if(c.sw&&!c.box){x.lineWidth=fs*c.sw;x.lineJoin="round";x.strokeStyle="#000";x.strokeText(k.t,px,y)}
x.fillStyle=on?c.hl:c.fill;x.fillText(k.t,px,y);x.shadowBlur=0;px+=m+sp});x.restore()}
function draw(){const W=cv.width,H=cv.height,b=$("bg").value,t=v.currentTime;x.fillStyle=b==="video"?"#000":b;x.fillRect(0,0,W,H);
if(b==="video"&&v.videoWidth)x.drawImage(v,0,0,W,H);const g=segs.find(s=>t>=s.s&&t<=s.e+.15);if(g)cap(g,t,W,H);requestAnimationFrame(draw)}draw();
$("play").onclick=()=>v.paused?v.play():v.pause();
const ts=(t,s)=>{const m=Math.round(t*1000),p=(n,l=2)=>String(n).padStart(l,"0");return`${p(m/36e5|0)}:${p(m/6e4%60|0)}:${p(m/1e3%60|0)}${s}${p(m%1e3,3)}`};
document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{const k=b.dataset.x;let s=k==="txt"?segs.map(g=>g.text).join("\n"):(k==="vtt"?"WEBVTT\n\n":"")+segs.map((g,i)=>(k==="srt"?i+1+"\n":"")+ts(g.s,k==="srt"?",":".")+" --> "+ts(g.e,k==="srt"?",":".")+"\n"+g.text+"\n").join("\n");
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/plain;charset=utf-8"}));a.download="captions."+k;a.click()});
$("rec").onclick=()=>{if(!v.src||!segs.length)return st("Generate captions first.");const s=cv.captureStream(30);try{v.captureStream().getAudioTracks().forEach(t=>s.addTrack(t))}catch(e){}
const ch=[],r=new MediaRecorder(s,{mimeType:"video/webm"});r.ondataavailable=e=>ch.push(e.data);r.onstop=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(ch,{type:"video/webm"}));a.download="captioned.webm";a.click();st("Saved.")};
v.currentTime=0;v.onended=()=>r.stop();r.start();v.play();st("Recording in real time - keep this tab open...")};
</script></body></html>
